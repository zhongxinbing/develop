<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>elint 工具性能监控</title>
    <!-- 引入 ECharts -->
    <script src="{{ url_for('static', filename='js/echarts.min.js') }}"></script>
    <!-- <head><link rel="stylesheet" href="templates/monitor.css"></head> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/monitor.css') }}">
</head>
<body>
    <div class="container">
        <!-- 显示可以访问的链接 -->
        <div class="access-info">
            <div class="stats-badge" id="projectStats"></div>

            <div style="display: flex; align-items: center; gap: 12px;">
                <div class="last-update" id="lastUpdateTime">最后更新: 刚刚</div>
                <button id="refreshBtn" class="refresh-btn">🔄 刷新数据</button>
            </div>
            <div style="display: flex; align-items: center; gap: 12px;">
                <button class="refresh-btn" onclick="window.location.href='/lint_perf/index.html'">
                    打开性能数据表格
                </button>
            </div>
        </div>
        <!-- 选择器 -->
        <div class="selector-container">
            <!-- case的选择 --> 
            <div class="selector-info">
                <div class="info-text">qor case:</div> 
                <select id="caseSelect" class="momitor-select">
                    {% for case in project_list %}
                    <option value="{{ case.id }}">{{ case.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <!-- 主要的rule的选择 -->
            <div class="selector-info">
                <div class="info-text">rule:</div> 
                <select id="ruleSelect" class="momitor-select">
                    <!-- 给 Overall 这一项加上 selected 即可默认显示 -->
                    <option value="Overall" selected>Overall</option>
                    {% for rule in rules %}
                    <option value="{{ rule.id }}">{{ rule.name }}&nbsp;</option>
                    {% endfor %}
                </select>
            </div>
            <div class="rule-search">
                <input type="text" id="ruleSearch" placeholder="🔍 搜索阶段名称..." autocomplete="off" class="rule-search">
            </div>
        </div>
        <!-- tab 标签 和曲线图 -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="runtime">⏱️ Runtime 曲线图</button>
            <button class="tab-btn" data-tab="memory">💾 Memory 曲线图</button>
            <!-- <button class="tab-btn" data-tab="cores">🖥️ Cores 曲线图</button> -->
        </div>

        <div id="runtime-tab" class="tab-content">
            <div class="card">
                <div id="chart-runtime" class="chart-container"></div>
                <div id="stats-runtime" class="stats-grid"></div>
            </div>
        </div>
        
        <div id="memory-tab" class="tab-content hidden">
            <div class="card">
            <div id="chart-memory" class="chart-container"></div>
                <div id="stats-memory" class="stats-grid"></div>
            </div>
        </div>
        
        <div id="cores-tab" class="tab-content hidden">
            <div class="card">
                <div id="chart-cores" class="chart-container"></div>
                <div id="stats-cores" class="stats-grid"></div>
            </div>
        </div>
        <!-- info 显示 -->
        <div class="info-bar">
            <span>📅 数据范围: <strong id="dateRange"></strong></span>
            <span>📈 数据点数: <strong id="dataPoints"></strong></span>
            <span>🔧 当前阶段: <strong id="currentRuleName">未选择</strong></span>
            <span><span class="badge">ECharts绘图</span> 交互式图表库</span>
            <span><span class="badge">优化版</span> 支持200+阶段流畅运行</span>
        </div>
    </div>

    <script>

        // 将 Python 后端传递的变量转换为 JSON 格式 
        const projectsData = {{ projects_data_json | tojson }};

        let casename = '{{ project_list[0].id }}';
        // let currentTool = null;
        let currentRule = null;
        let toolSearchTimeout = null;

// ECharts实例
let charts = {
    runtime: null,
    memory: null,
    cores: null
};

// 图表颜色配置
const chartColors = {
    runtime: '#3b82f6',
    memory: '#10b981',
    cores: '#8b5cf6'
};

// 缓存阶段列表，避免重复过滤
let cachedTools = [];
let cachedToolData = {};
let lastRenderedDataHash = {
    runtime: '',
    memory: '',
            cores: ''
        };
    </script>


    <script src="{{ url_for('static', filename='js/monitor.js') }}"></script>
</body>
</html>
