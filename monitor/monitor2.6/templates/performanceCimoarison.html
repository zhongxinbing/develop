<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具页面 - EDA QOR</title>
    <script src="{{ url_for('static', filename='js/echarts.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/axios.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-container tool-page">
        <!-- 顶部导航栏 -->
        <header class="tool-header">
            <button class="back-btn" id="backBtn">
                <div class="logo-icon">📈 </div>
                <div class="logo-text">
                    <h1>EDA QOR</h1>
                    <span>性能监控平台</span>
                </div>
            </button>
            <div class="tool-info">
                <h2 id="toolName">加载中...</h2>
                <span class="tool-desc" id="toolDesc"></span>
            </div>
            <!-- 修改：刷新按钮改为配置按钮 -->
            <button class="refresh-btn" id="configBtn" title="工具配置">
                <span>⚙️ 配置</span>
            </button>
        </header>
        <div class="tool-content">
            <div id="performanceChart" class="chart-container">
                <p> QOR性能对比结果 </p>
            </div>

        </div>
    </div>
    <script src="{{ url_for('static', filename='js/tool.js') }}"></script>
</html>
