<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>工具入口 - EDA QOR</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/select.css') }}">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <button class="back-btn" id="backBtn">
                <div class="logo-icon">📈 </div>
                <div class="logo-text">
                    <h1>EDA QOR</h1>
                    <span>性能监控平台</span>
                </div>
            </button>
        </header>

        <main class="main-content" style="justify-content: center;">
            <div class="stats-card" style="width: min(520px, 90vw);">
                <div class="stats-number" style="font-size: 32px;">工具入口</div>
                <div class="stats-label" style="font-size: 15px; margin-bottom: 20px;">请选择查看内容</div>

                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 18px; margin-top: 12px;">

                    <a id="regressionBtn" class="tool-view-card" href="/tool/{{ tool_id }}/regression">
                        <div class="tool-card-icon">📋</div>
                        <h3> regression</h3>
                        <p>每日回归结果</p>
                    </a>
                    <a id="caseBtn" class="tool-view-card" href="/tool/{{ tool_id }}/bigcase">
                        <div class="tool-card-icon">📈</div>
                        <h3> Qor Case 功能 </h3>
                        <p>查看性能变化和性能数据的曲线图</p>
                    </a>
                    <a id="performanceBtn" class="tool-view-card" href="/tool/{{ tool_id }}/performance">
                        <div class="tool-card-icon">📈</div>
                        <h3> QOR 性能 </h3>
                        <p>查看性能变化和性能数据的曲线图</p>
                    </a>
                    <a id="compareBtn" class="tool-view-card" href="/tool/{{ tool_id }}/performanceCimoarison">
                        <div class="tool-card-icon">📈</div>
                        <h3> QOR 性能对比结果 </h3>
                        <p>查看性能对比结果</p>
                    </a>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('backBtn').addEventListener('click', function () {
            window.location.href = '/';
        });
    </script>
    <script src="{{ url_for('static', filename='js/regression.js') }}"></script>
</body>
</html>
