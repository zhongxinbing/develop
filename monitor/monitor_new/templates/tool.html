<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{ tool_name }} 性能监控</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.2/dist/echarts.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        window.toolId = '{{ tool_id }}';
        window.initialProjects = {{ projects_data_json|tojson|safe }};
        window.projectList = {{ project_list|tojson|safe }};
        window.hasSingle = {{ has_single|tojson|safe }};
        window.hasMulti = {{ has_multi|tojson|safe }};
    </script>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h2 class="brand">{{ tool_name }}</h2>
            <nav>
                <button data-view="single" class="nav-btn active">单线程曲线图</button>
                <button data-view="multi" class="nav-btn">多线程曲线图</button>
                <button data-view="threads" class="nav-btn">线程曲线图</button>
                <button data-view="compare" class="nav-btn">数据对比</button>
                <button data-view="custom" class="nav-btn">自定义曲线图</button>
            </nav>
        </aside>
        <main class="main">
            <section id="single" class="view active">
                <h3>单线程曲线图</h3>
                <div class="subnav">
                    <button class="sub-btn active" data-target="single-runtime">Runtime</button>
                    <button class="sub-btn" data-target="single-memory">Memory</button>
                    <button class="sub-btn" data-target="single-compare">数据对比</button>
                    <button class="sub-btn" data-target="single-custom">自定义曲线</button>
                </div>
                <div class="controls">
                    <select id="singleCaseSelect"></select>
                    <select id="singleRuleSelect"></select>
                    <button id="singleRuntimeBtn">Runtime</button>
                    <button id="singleMemoryBtn">Memory</button>
                </div>
                <div id="singleChart" class="chart"></div>
                <div id="single-compare" class="subview hidden">
                    <div class="subpanel-controls">
                        <select id="singleCompareRuleA"></select>
                        <select id="singleCompareRuleB"></select>
                        <select id="singleCompareMetric">
                            <option value="runtime">Runtime</option>
                            <option value="memory">Memory</option>
                        </select>
                    </div>
                    <div id="singleCompareChart" class="chart" style="height:320px"></div>
                </div>
                <div id="single-custom" class="subview hidden">
                    <div class="subpanel-controls">
                        <select id="singleCustomRule"></select>
                        <select id="singleCustomThreadSelect"></select>
                        <select id="singleCustomMetric">
                            <option value="runtime">Runtime</option>
                            <option value="memory">Memory</option>
                        </select>
                    </div>
                    <div id="singleCustomChart" class="chart" style="height:320px"></div>
                </div>

            <section id="multi" class="view">
                <h3>多线程曲线图</h3>
                <div class="subnav">
                    <button class="sub-btn active" data-target="multi-runtime">Runtime</button>
                    <button class="sub-btn" data-target="multi-memory">Memory</button>
                    <button class="sub-btn" data-target="multi-compare">数据对比</button>
                    <button class="sub-btn" data-target="multi-custom">自定义曲线</button>
                </div>
                <div class="controls">
                    <select id="multiCaseSelect"></select>
                    <select id="multiRuleSelect"></select>
                    <button id="multiRuntimeBtn">Runtime</button>
                    <button id="multiMemoryBtn">Memory</button>
                </div>
                <div id="multiChart" class="chart"></div>
                <div id="multi-compare" class="subview hidden">
                    <div class="subpanel-controls">
                        <select id="multiCompareRuleA"></select>
                        <select id="multiCompareRuleB"></select>
                        <select id="multiCompareMetric">
                            <option value="runtime">Runtime</option>
                            <option value="memory">Memory</option>
                        </select>
                    </div>
                    <div id="multiCompareChart" class="chart" style="height:320px"></div>
                </div>
                <div id="multi-custom" class="subview hidden">
                    <div class="subpanel-controls">
                        <select id="multiCustomRule"></select>
                        <select id="multiCustomThreadSelect"></select>
                        <select id="multiCustomMetric">
                            <option value="runtime">Runtime</option>
                            <option value="memory">Memory</option>
                        </select>
                    </div>
                    <div id="multiCustomChart" class="chart" style="height:320px"></div>
                </div>

            <section id="threads" class="view">
                <h3>线程曲线图</h3>
                <div class="subnav">
                    <button class="sub-btn active" data-target="threads-runtime">Runtime</button>
                    <button class="sub-btn" data-target="threads-memory">Memory</button>
                    <button class="sub-btn" data-target="threads-compare">数据对比</button>
                    <button class="sub-btn" data-target="threads-custom">自定义曲线</button>
                </div>
                <div class="controls">
                    <select id="threadsCaseSelect"></select>
                    <select id="threadsRuleSelect"></select>
                    <select id="threadsDateSelect"></select>
                    <button id="threadsRuntimeBtn">Runtime</button>
                    <button id="threadsMemoryBtn">Memory</button>
                </div>
                <div id="threadsChart" class="chart"></div>
                <div id="threads-compare" class="subview hidden">
                    <div class="subpanel-controls">
                        <select id="threadsCompareDateA"></select>
                        <select id="threadsCompareDateB"></select>
                        <select id="threadsCompareMetric">
                            <option value="runtime">Runtime</option>
                            <option value="memory">Memory</option>
                        </select>
                    </div>
                    <div id="threadsCompareChart" class="chart" style="height:320px"></div>
                </div>
                <div id="threads-custom" class="subview hidden">
                    <div class="subpanel-controls">
                        <select id="threadsCustomRule"></select>
                        <select id="threadsCustomThreadSelect"></select>
                        <select id="threadsCustomMetric">
                            <option value="runtime">Runtime</option>
                            <option value="memory">Memory</option>
                        </select>
                    </div>
                    <div id="threadsCustomChart" class="chart" style="height:320px"></div>
                </div>

            <section id="compare" class="view">
                <h3>数据对比</h3>
                <div class="controls">
                    <select id="compareCaseA"></select>
                    <select id="compareCaseB"></select>
                    <select id="compareRuleSelect"></select>
                    <select id="compareMetricSelect">
                        <option value="runtime">Runtime</option>
                        <option value="memory">Memory</option>
                    </select>
                </div>
                <div id="compareChart" class="chart"></div>
                <div id="compareNotice" class="subview hidden"></div>
            </section>

            <section id="custom" class="view">
                <h3>自定义曲线图</h3>
                <div class="controls">
                    <select id="customCaseSelect"></select>
                    <select id="customRuleSelect"></select>
                    <select id="customThreadSelect"></select>
                    <select id="customMetricSelect">
                        <option value="runtime">Runtime</option>
                        <option value="memory">Memory</option>
                    </select>
                </div>
                <div id="customChart" class="chart"></div>
                <div id="customNotice" class="subview hidden">请选择项目、规则与线程后查看曲线。</div>
            </section>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const navButtons = document.querySelectorAll('.nav-btn');
            navButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.view').forEach(view => view.classList.remove('active'));
                    document.querySelectorAll('.nav-btn').forEach(item => item.classList.remove('active'));
                    const target = btn.dataset.view;
                    document.getElementById(target)?.classList.add('active');
                    btn.classList.add('active');
                });
            });
            document.querySelectorAll('.subnav').forEach(subnav => {
                subnav.addEventListener('click', event => {
                    const button = event.target.closest('.sub-btn');
                    if (!button) return;
                    const view = subnav.closest('.view');
                    if (!view) return;
                    view.querySelectorAll('.sub-btn').forEach(item => item.classList.remove('active'));
                    view.querySelectorAll('.subview').forEach(panel => panel.classList.add('hidden'));
                    button.classList.add('active');
                    const target = button.dataset.target;
                    view.querySelector(`#${target}`)?.classList.remove('hidden');
                });
            });
        });
    </script>
    <script src="{{ url_for('static', filename='js/chart-common.js') }}"></script>
    <script src="{{ url_for('static', filename='js/single-thread.js') }}"></script>
    <script src="{{ url_for('static', filename='js/multi-thread.js') }}"></script>
    <script src="{{ url_for('static', filename='js/thread-curve.js') }}"></script>
    <script src="{{ url_for('static', filename='js/compare.js') }}"></script>
    <script src="{{ url_for('static', filename='js/custom.js') }}"></script>
</body>
</html>
