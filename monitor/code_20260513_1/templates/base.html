<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EDA性能监控系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">📊 EDA性能监控</a>
            <div class="nav-links">
                <a href="/monitor" class="nav-link">监控面板</a>
                <a href="/compare" class="nav-link">数据对比</a>
            </div>
            <div class="nav-info">
                <span id="serverInfo"></span>
            </div>
        </div>
    </nav>
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>
    <script>
        fetch('/api/server-info')
            .then(res => res.json())
            .then(data => {
                document.getElementById('serverInfo').innerHTML = `🌐 ${data.local_ip}:${data.port}`;
            });
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
