<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}性能监控系统{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block head_extra %}{% endblock %}
</head>
<body data-page="{{ page_id if page_id is defined else '' }}">
<header class="app-header">
    <div class="header-brand"><a href="/">性能监控平台</a></div>
    <nav class="header-nav">
        <a href="/">首页</a>
        <a href="/elint">监控</a>
        <a href="/compare">比较</a>
    </nav>
</header>
<main class="app-main">{% block content %}{% endblock %}</main>
<footer class="app-footer">© 2026 性能监控系统</footer>
<script>document.documentElement.classList.add('js-ready');</script>
{% block scripts %}{% endblock %}
</body>
</html>
