{% extends 'base.html' %}
{% block title %}性能监控 - ELINT{% endblock %}
{% block content %}
<section class="panel-row monitor-panel">
    <aside class="control-panel">
        <div class="panel-card">
            <h2>当前视图</h2>
            <div class="control-row">
                <label>项目</label>
                <select id="projectSelect"></select>
            </div>
            <div class="control-row">
                <label>模式</label>
                <div class="toggle-group">
                    <button class="toggle-btn active" data-mode="single">单线程</button>
                    <button class="toggle-btn" data-mode="multi">多线程</button>
                </div>
            </div>
            <div class="control-row">
                <label>阶段</label>
                <input id="ruleSearch" type="search" placeholder="输入阶段名称搜索">
                <select id="ruleSelect"></select>
            </div>
            <div class="control-row">
                <button class="btn btn-primary" id="refreshBtn">刷新数据</button>
            </div>
        </div>
        <div class="panel-card info-card">
            <h3>性能指标</h3>
            <div class="metric-row"><span>CPU</span><strong id="perfCpu">-</strong></div>
            <div class="metric-row"><span>内存</span><strong id="perfMem">-</strong></div>
            <div class="metric-row"><span>吞吐</span><strong id="perfExtra">-</strong></div>
        </div>
    </aside>
    <section class="chart-panel">
        <div class="chart-strip">
            <div class="chart-card">
                <div class="chart-card-title">Runtime 趋势</div>
                <div id="chartRuntime" class="chart-area"></div>
            </div>
            <div class="chart-card">
                <div class="chart-card-title">Memory 趋势</div>
                <div id="chartMemory" class="chart-area"></div>
            </div>
        </div>
        <div class="chart-strip" id="threadSection">
            <div class="chart-card full-width">
                <div class="chart-card-title">线程数对比</div>
                <div id="chartThread" class="chart-area"></div>
            </div>
        </div>
    </section>
</section>
{% endblock %}
{% block scripts %}
<script>
    const projectsData = {{ projects_data_json | tojson | safe }};
    const perfStats = {{ perf | tojson | safe }};
    const initialProjectId = '{{ project_list[0].id if project_list else '' }}';
    const initialThreadMode = '{{ active_thread }}';
</script>
<script src="{{ url_for('static', filename='js/echarts.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% endblock %}
