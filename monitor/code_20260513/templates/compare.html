{% extends 'base.html' %}
{% block title %}数据对比{% endblock %}
{% block content %}
<section class="panel-row compare-panel">
    <aside class="control-panel">
        <div class="panel-card">
            <h2>对比设置</h2>
            <div class="control-row">
                <label>项目</label>
                <select id="projectSelect"></select>
            </div>
            <div class="control-row">
                <label>方式</label>
                <select id="compareMode">
                    <option value="single">单阶段</option>
                    <option value="all">全阶段</option>
                </select>
            </div>
            <div class="control-row" id="ruleRow">
                <label>阶段</label>
                <select id="ruleSelect"></select>
            </div>
            <div class="control-row">
                <label>日期 1</label>
                <select id="date1Select"></select>
            </div>
            <div class="control-row">
                <label>日期 2</label>
                <select id="date2Select"></select>
            </div>
            <div class="control-row">
                <label>Runtime 容差</label>
                <input id="toleranceRuntime" type="number" step="0.1" value="0">
            </div>
            <div class="control-row">
                <label>Memory 容差</label>
                <input id="toleranceMemory" type="number" step="1" value="0">
            </div>
            <div class="control-row">
                <label>误差模式</label>
                <select id="toleranceMode">
                    <option value="absolute">绝对值</option>
                    <option value="percentage">百分比</option>
                </select>
            </div>
            <div class="control-row">
                <button class="btn btn-primary" id="compareBtn">开始对比</button>
            </div>
        </div>
    </aside>
    <section class="chart-panel compare-result-panel">
        <div class="panel-card" id="compareSummary" hidden>
            <h3>对比结果概览</h3>
            <div id="summaryBoxes" class="summary-grid"></div>
        </div>
        <div class="panel-card" id="compareTableCard" hidden>
            <h3>对比详情</h3>
            <div class="table-wrapper">
                <table class="result-table">
                    <thead id="tableHead"></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </section>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/compare.js') }}"></script>
{% endblock %}
