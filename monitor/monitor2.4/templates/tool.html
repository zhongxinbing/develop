<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>工具详情 - EDA QOR 性能监控</title>
  <link rel="stylesheet" href="/static/css/base.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">工具详情</div>
    <div class="top-actions">
      <a class="button" href="/">首页</a>
      <a class="button secondary" href="/config">工具配置</a>
    </div>
  </header>

  <main class="page-content tool-page">
    <section class="card-panel tool-header">
      <div>
        <h2 id="tool-name">工具名称</h2>
        <p id="tool-desc">工具描述</p>
      </div>
      <div class="tool-meta" id="tool-extra"></div>
    </section>

    <section class="card-panel tabs-panel">
      <div class="tabs" id="mode-tabs"></div>
      <div class="subtabs" id="view-tabs"></div>
    </section>

    <section class="card-panel controls-panel">
      <div class="control-row">
        <label>casename<select id="case-select"></select></label>
        <label>rule<select id="rule-select"></select></label>
        <input id="rule-search" placeholder="搜索 rule" />
      </div>
      <div class="control-row">
        <button class="button" id="date-picker-button">选择日期</button>
        <button class="button secondary" id="latest-50-button">最近50天</button>
        <button class="button primary" id="open-add-path">添加数据</button>
      </div>
    </section>

    <section class="card-panel chart-panel">
      <div id="chart" class="chart-box"></div>
      <div class="chart-summary" id="chart-summary"></div>
    </section>

    <section class="card-panel compare-panel" id="compare-panel">
      <h3>数据对比</h3>
      <div class="compare-grid">
        <label>casename<select id="compare-case"></select></label>
        <label>rule<input id="compare-rule" placeholder="搜索 rule" /></label>
        <label>日期1<select id="compare-date-a"></select></label>
        <label>日期2<select id="compare-date-b"></select></label>
        <label>误差模式<select id="compare-mode"><option value="absolute">绝对值</option><option value="percent">百分比</option></select></label>
        <label>对比维度<select id="compare-dimension"><option value="all">全部</option><option value="runtime">runtime</option><option value="memory">memory</option></select></label>
        <label>runtime 误差<input id="runtime-threshold" type="number" min="0" value="0" /></label>
        <label>memory 误差<input id="memory-threshold" type="number" min="0" value="0" /></label>
      </div>
      <div class="compare-actions">
        <button class="button primary" id="compare-submit">确认对比</button>
        <button class="button secondary" id="compare-export">导出结果</button>
      </div>
      <div id="compare-result"></div>
    </section>
  </main>

  <div class="modal" id="date-modal" hidden>
    <div class="modal-content">
      <h3>选择日期</h3>
      <input id="date-search" placeholder="搜索日期" />
      <div class="date-list" id="date-list"></div>
      <div class="modal-actions">
        <button class="button" id="toggle-all-dates">全选 / 取消</button>
        <button class="button primary" id="date-apply">确认</button>
        <button class="button secondary" id="date-cancel">取消</button>
      </div>
    </div>
  </div>

  <div class="modal" id="add-path-modal" hidden>
    <div class="modal-content">
      <h3>添加数据路径</h3>
      <textarea id="path-input" rows="5" placeholder="请输入多个路径，每行一个"></textarea>
      <div class="modal-actions">
        <button class="button primary" id="path-apply">确认</button>
        <button class="button secondary" id="path-cancel">取消</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.2/dist/echarts.min.js"></script>
  <script>
    const TOOL_ID = "{{ tool_id }}";
  </script>
  <script src="/static/js/tool.js"></script>
</body>
</html>
