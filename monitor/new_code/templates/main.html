<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>EDA性能监控系统 - 工具选择</title>
    <style>
        /* ==================================================
           全局样式 - 现代化重置与变量定义
        ================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 主色调 - 现代科技感 */
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #06b6d4;
            --accent: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            
            /* 背景色 */
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-card-hover: #2d3a5e;
            --bg-sidebar: #0f172a;
            
            /* 文字颜色 */
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            /* 边框 */
            --border: #334155;
            
            /* 阴影 */
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1);
            --glow: 0 0 20px rgba(99, 102, 241, 0.3);
            
            /* 圆角 */
            --radius-sm: 0.5rem;
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
            
            /* 过渡 */
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, #0b1120 100%);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        /* 容器布局 - 使用Flexbox居中 */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* 头部样式 */
        .hero {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.6s ease-out;
        }

        .hero h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-light), var(--secondary));
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 0.75rem;
        }

        .hero .subtitle {
            font-size: 1.125rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* 统计卡片行 */
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-radius: var(--radius-lg);
            padding: 1rem 2rem;
            text-align: center;
            border: 1px solid rgba(99, 102, 241, 0.2);
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
            box-shadow: var(--glow);
        }

        .stat-card .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-light);
        }

        .stat-card .stat-label {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        /* 工具卡片网格 - CSS Grid 布局核心 */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        /* 工具卡片样式 */
        .tool-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            border: 1px solid var(--border);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }

        .tool-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: var(--glow);
        }

        /* 卡片头部 - 图标和标题 */
        .card-header {
            padding: 1.5rem 1.5rem 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .card-icon {
            font-size: 3rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-lg);
            transition: var(--transition);
        }

        .tool-card:hover .card-icon {
            transform: scale(1.05);
        }

        .card-title h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .card-title p {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 0.25rem;
        }

        /* 卡片内容 */
        .card-content {
            padding: 1.25rem 1.5rem;
        }

        .tool-description {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.6;
            margin-bottom: 1.25rem;
        }

        /* 模式按钮组 - Flexbox 布局 */
        .mode-buttons {
            display: flex;
            gap: 0.75rem;
        }

        .mode-btn {
            flex: 1;
            padding: 0.625rem 1rem;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 0.875rem;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: rgba(99, 102, 241, 0.1);
            color: var(--text-secondary);
        }

        .mode-btn.single {
            border: 1px solid var(--primary);
            color: var(--primary-light);
        }

        .mode-btn.single:hover {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
        }

        .mode-btn.multi {
            border: 1px solid var(--secondary);
            color: var(--secondary);
        }

        .mode-btn.multi:hover {
            background: var(--secondary);
            color: white;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
        }

        /* 卡片底部 */
        .card-footer {
            padding: 1rem 1.5rem 1.5rem;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        /* 底部信息 */
        .footer-info {
            text-align: center;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* 动画 */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        /* 卡片入场动画 */
        .tool-card {
            animation: fadeInUp 0.5s ease-out forwards;
            opacity: 0;
        }

        .tool-card:nth-child(1) { animation-delay: 0.1s; }
        .tool-card:nth-child(2) { animation-delay: 0.2s; }
        .tool-card:nth-child(3) { animation-delay: 0.3s; }
        .tool-card:nth-child(4) { animation-delay: 0.4s; }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .hero h1 {
                font-size: 2rem;
            }
            
            .tools-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            
            .stats-row {
                gap: 0.75rem;
            }
            
            .stat-card {
                padding: 0.75rem 1rem;
            }
            
            .stat-card .stat-number {
                font-size: 1.5rem;
            }
        }

        /* 加载状态 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(8px);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 头部区域 -->
        <div class="hero">
            <h1>⚡ EDA 性能监控系统</h1>
            <p class="subtitle">实时监控 EDA 流程性能数据，支持多项目、多阶段、多线程对比分析</p>
        </div>

        <!-- 统计卡片行 - Flexbox 居中布局 -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-number" id="toolCount">0</div>
                <div class="stat-label">可用工具</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="modeCount">0</div>
                <div class="stat-label">监控模式</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">实时</div>
                <div class="stat-label">数据更新</div>
            </div>
        </div>

        <!-- 工具卡片网格 - CSS Grid 核心布局 -->
        <div class="tools-grid" id="toolsGrid">
            <!-- 卡片将通过 JavaScript 动态渲染，确保与 CASE_CONFIG 同步 -->
        </div>

        <!-- 底部信息 -->
        <div class="footer-info">
            <span>📊 数据实时同步 | 🔄 自动检测更新 | 📈 支持多维度对比</span>
        </div>
    </div>

    <!-- 加载遮罩 -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <script>
        /**
         * EDA 性能监控系统 - 主页面脚本
         * 负责渲染工具卡片网格，处理导航跳转
         * 使用 Grid 布局展示工具卡片，支持悬浮效果
         */

        // 工具配置 - 与后端 CASE_CONFIG 同步，通过 Flask 模板变量注入
        const toolsConfig = {{ tools | tojson }};
        
        // 统计信息
        let toolCount = toolsConfig.length;
        let modeCount = 0;
        
        // 计算总模式数
        toolsConfig.forEach(tool => {
            if (tool.has_single) modeCount++;
            if (tool.has_multi) modeCount++;
        });
        
        // 更新统计显示
        document.getElementById('toolCount').textContent = toolCount;
        document.getElementById('modeCount').textContent = modeCount;
        
        /**
         * 渲染工具卡片网格
         * 使用 Grid 布局，每个卡片包含图标、标题、描述和模式选择按钮
         */
        function renderToolsGrid() {
            const gridContainer = document.getElementById('toolsGrid');
            
            if (!toolsConfig || toolsConfig.length === 0) {
                gridContainer.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 3rem;">
                        <p style="color: var(--text-secondary);">暂无可用工具，请检查配置</p>
                    </div>
                `;
                return;
            }
            
            // 生成卡片 HTML
            const cardsHtml = toolsConfig.map(tool => `
                <div class="tool-card" data-tool-id="${tool.id}">
                    <div class="card-header">
                        <div class="card-icon">${tool.icon || '🔧'}</div>
                        <div class="card-title">
                            <h2>${tool.name}</h2>
                            <p>${tool.description || 'EDA 工具性能监控'}</p>
                        </div>
                    </div>
                    <div class="card-content">
                        <div class="tool-description">
                            ${getToolDescription(tool.id)}
                        </div>
                        <div class="mode-buttons">
                            ${tool.has_single ? `<button class="mode-btn single" data-mode="single">📈 时序曲线图</button>` : ''}
                            ${tool.has_multi ? `<button class="mode-btn multi" data-mode="multi">🔄 多线程对比图</button>` : ''}
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="status-badge">
                            <span class="status-dot"></span>
                            <span>服务可用</span>
                        </div>
                        <span>点击按钮开始监控 →</span>
                    </div>
                </div>
            `).join('');
            
            gridContainer.innerHTML = cardsHtml;
            
            // 绑定卡片事件
            bindCardEvents();
        }
        
        /**
         * 获取工具描述
         * @param {string} toolId - 工具ID
         * @returns {string} 工具描述文本
         */
        function getToolDescription(toolId) {
            const descriptions = {
                'elint': 'ELINT 工具用于代码规范检查和Lint分析，支持Runtime和Memory性能监控。提供单线程时序图和多线程对比图两种视图模式。',
                'ecdc': 'ECDC 工具用于跨时钟域分析，检测设计中的CDC问题。实时监控CDC检查的性能指标。'
            };
            return descriptions[toolId] || 'EDA 流程性能监控工具，提供全面的性能数据可视化分析能力。';
        }
        
        /**
         * 显示加载状态
         * @param {boolean} show - 是否显示加载遮罩
         */
        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (overlay) {
                overlay.style.display = show ? 'flex' : 'none';
            }
        }
        
        /**
         * 导航到工具页面
         * @param {string} toolId - 工具ID
         * @param {string} mode - 模式 (single/multi)
         */
        function navigateToTool(toolId, mode) {
            // 显示加载状态
            showLoading(true);
            
            // 构建目标URL
            const targetUrl = `/tool/${toolId}?mode=${mode}`;
            
            // 延迟跳转，让加载动画有显示时间
            setTimeout(() => {
                window.location.href = targetUrl;
            }, 300);
        }
        
        /**
         * 绑定卡片按钮点击事件
         */
        function bindCardEvents() {
            // 绑定单线程模式按钮
            document.querySelectorAll('.mode-btn.single').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const card = btn.closest('.tool-card');
                    const toolId = card.dataset.toolId;
                    navigateToTool(toolId, 'single');
                });
            });
            
            // 绑定多线程模式按钮
            document.querySelectorAll('.mode-btn.multi').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const card = btn.closest('.tool-card');
                    const toolId = card.dataset.toolId;
                    navigateToTool(toolId, 'multi');
                });
            });
            
            // 可选：点击卡片整体也可跳转（默认跳转到单线程模式）
            document.querySelectorAll('.tool-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    // 如果点击的是按钮，不重复触发
                    if (e.target.classList && e.target.classList.contains('mode-btn')) {
                        return;
                    }
                    const toolId = card.dataset.toolId;
                    const tool = toolsConfig.find(t => t.id === toolId);
                    if (tool && tool.has_single) {
                        navigateToTool(toolId, 'single');
                    } else if (tool && tool.has_multi) {
                        navigateToTool(toolId, 'multi');
                    }
                });
            });
        }
        
        /**
         * 页面初始化
         */
        function init() {
            renderToolsGrid();
            
            // 添加页面可见性变化监听，刷新统计数据
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    // 页面重新可见时，可以触发数据检查
                    console.log('页面已激活');
                }
            });
        }
        
        // 启动应用
        init();
    </script>
</body>
</html>
