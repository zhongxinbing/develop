<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>EDA性能监控系统 - 工具选择</title>
    <script src="{{ url_for('static', filename='js/echarts.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
    <div class="container">
        <!-- 头部区域 -->
        <div class="hero">
            <h1>⚡ EDA 性能监控系统</h1>
            <p class="subtitle">实时监控 EDA 流程性能数据，支持多项目、多阶段、多线程对比分析</p>
        </div>

        <!-- 统计卡片行 - Flexbox 居中布局 -->
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-number" id="toolCount">0</div>
                <div class="stat-label">可用工具</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="modeCount">0</div>
                <div class="stat-label">监控模式</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">实时</div>
                <div class="stat-label">数据更新</div>
            </div>
        </div>

        <!-- 工具卡片网格 - CSS Grid 核心布局 -->
        <div class="tools-grid" id="toolsGrid">
            <!-- 卡片将通过 JavaScript 动态渲染，确保与 CASE_CONFIG 同步 -->
        </div>

        <!-- 底部信息 -->
        <div class="footer-info">
            <span>📊 数据实时同步 | 🔄 自动检测更新 | 📈 支持多维度对比</span>
        </div>
    </div>

    <!-- 加载遮罩 -->
    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>
    <script>
        // 工具配置 - 与后端 CASE_CONFIG 同步，通过 Flask 模板变量注入
        const toolsConfig = {{ tools | tojson }};

        // 统计信息
        let toolCount = toolsConfig.length;
        let modeCount = 0;
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
