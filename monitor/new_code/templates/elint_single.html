<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#0f0f1a">
    <title>ELINT 性能监控 | EDA流程监控系统</title>
    <script src="{{ url_for('static', filename='js/echarts.min.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/monitor.css') }}">
</head>
<body>
    <div class="container">
        <!-- 头部信息栏 -->
        <div class="access-info">
            <div class="stats-badge" id="projectStats"></div>
            <div class="access-group">
                <div class="last-update" id="lastUpdateTime">最后更新: 刚刚</div>
                <div class="auto-refresh-status">
                    <span class="refresh-indicator" data-tooltip="自动检测数据更新"></span>
                    自动检测
                </div>
            </div>
            <div class="access-actions">
                <button class="btn-secondary" onclick="window.open('/lint_perf/index.html', '_blank')">
                    📊 性能表格
                </button>
                <button class="compare-btn" onclick="window.open('/compare', '_blank')">
                    📈 数据对比
                </button>
                <button class="refresh-btn" id="refreshBtn">
                    🔄 刷新数据
                </button>
            </div>
        </div>
        
        <!-- 选择器区域 -->
        <div class="selector-container">
            <div class="selector-info">
                <div class="info-text">📁 项目</div>
                <select id="caseSelect" class="momitor-select">
                    {% for project in project_list %}
                    <option value="{{ project.id }}" {% if loop.first %}selected{% endif %}>{{ project.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="selector-info">
                <div class="info-text">🔧 阶段</div>
                <select id="ruleSelect" class="momitor-select">
                    <option value="">-- 请选择阶段 --</option>
                </select>
            </div>
            <div class="rule-search">
                <input type="text" id="ruleSearch" placeholder="🔍 搜索阶段..." autocomplete="off">
            </div>
        </div>
        
        <!-- 日期选择模态框 -->
        <div id="datePickerModal" class="modal hidden">
            <div class="modal-overlay" id="datePickerOverlay"></div>
            <div class="modal-dialog">
                <div class="modal-header">
                    <h2>📅 选择显示日期</h2>
                    <button class="modal-close-btn" id="closeDatePickerBtn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="modal-info">💡 可多选，支持筛选</div>
                    <input id="dateFilterInput" type="text" class="date-filter-input" placeholder="筛选日期...">
                    <div id="dateOptionsContainer" class="date-options-container"></div>
                </div>
                <div class="modal-actions">
                    <button class="btn-secondary" id="modalRecentBtn">📅 最近51条</button>
                    <button class="btn-secondary" id="modalAllDatesBtn">📅 全部日期</button>
                    <button class="refresh-btn" id="confirmDateSelectionBtn">✅ 确认应用</button>
                    <button class="btn-secondary" id="cancelDateSelectionBtn">❌ 取消</button>
                </div>
            </div>
        </div>
        
        <!-- 日期控制栏 -->
        <div class="date-control-panel">
            <div class="date-control-card">
                <div class="date-control-info">
                    <div class="info-text">📅 曲线图日期范围</div>
                    <div class="date-control-summary">
                        <span id="selectedDateSummary">最近 51 条</span>
                    </div>
                    <div class="date-control-tip">
                        💡 点击图例可切换线程，带 🔴 标记的点表示有MR更新
                    </div>
                </div>
                <div class="date-control-actions">
                    <button class="refresh-btn" id="openDatePickerBtn">📅 选择日期</button>
                    <button class="btn-secondary" id="selectRecentBtn">📊 最近51条</button>
                    <button class="btn-secondary" id="selectAllDatesBtn">📊 全部显示</button>
                </div>
            </div>
        </div>
        
        <!-- Tab切换 -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="runtime">⏱️ Runtime 性能</button>
            <button class="tab-btn" data-tab="memory">💾 Memory 占用</button>
            <div class="thread-summary-panel">
                <span class="thread-summary-label">🔧 当前线程</span>
                <strong class="thread-summary-value" id="threadSummary">0</strong>
            </div>
        </div>
        
        <!-- Runtime Tab -->
        <div id="runtime-tab" class="tab-content">
            <div class="card">
                <div id="chart-runtime" class="chart-container"></div>
                <div id="stats-runtime" class="stats-grid"></div>
            </div>
        </div>
        
        <!-- Memory Tab -->
        <div id="memory-tab" class="tab-content hidden">
            <div class="card">
                <div id="chart-memory" class="chart-container"></div>
                <div id="stats-memory" class="stats-grid"></div>
            </div>
        </div>
        
        <!-- 底部信息栏 -->
        <div class="info-bar">
            <span>📅 数据范围: <strong id="dateRange">-</strong></span>
            <span>📈 数据点数: <strong id="dataPoints">0</strong></span>
            <span>🔧 当前阶段: <strong id="currentRuleName">未选择</strong></span>
            <span>🎨 ECharts 可视化</span>
        </div>
    </div>
    
    <script>
        // 后端数据注入
        const projectsData = {{ projects_data_json | tojson }};
        const perf = {{ perf | tojson }};
        let casename = '{{ project_list[0].id if project_list else "" }}';
    </script>
    <script src="{{ url_for('static', filename='js/monitor.js') }}"></script>
</body>
</html>
