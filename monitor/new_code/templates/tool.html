<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>{{ tool_name }} 性能监控系统</title>
    <script src="{{ url_for('static', filename='js/echarts.min.js') }}"></script>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/tool.css') }}">

</head>
<body>
    <div class="app-container">
        <!-- 侧边栏导航 -->
        <aside class="sidebar">
            <div class="sidebar-header" id="backToHomeBtn">
                <h1>
                    <span class="tool-icon">{{ tool_icon }}</span>
                    <span class="tool-name">{{ tool_name }}</span>
                </h1>
                <div class="version">性能监控系统 v2.0</div>
            </div>
            
            <nav class="nav-menu">
                <div class="nav-item active" data-view="timeline">
                    <span class="nav-icon">📈</span>
                    <span class="nav-label">时序曲线图</span>
                </div>
                <div class="nav-item" data-view="multithread">
                    <span class="nav-icon">🔄</span>
                    <span class="nav-label">多线程对比</span>
                </div>
                <div class="nav-item" data-view="compare">
                    <span class="nav-icon">📊</span>
                    <span class="nav-label">数据对比</span>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <div class="refresh-status">
                    <span class="status-dot" id="statusDot"></span>
                    <span id="lastUpdateText">等待刷新</span>
                </div>
                <button class="btn btn-secondary" id="refreshDataBtn" style="width: 100%; margin-top: 0.75rem;">
                    🔄 刷新数据
                </button>
            </div>
        </aside>

        <!-- 主内容区域 -->
        <main class="main-content">
            <!-- ==================================================
                 视图1: 时序曲线图
            ================================================== -->
            <div id="timelineView" class="view-container active">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">📊 项目概览</div>
                    </div>
                    <div class="stats-grid" id="projectStats"></div>
                </div>

                <div class="card">
                    <div class="control-bar">
                        <div class="control-group">
                            <label class="control-label">📁 QOR Case</label>
                            <select id="caseSelect">
                                {% for project in project_list %}
                                <option value="{{ project.id }}">{{ project.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="control-group">
                            <label class="control-label">🔧 阶段/Rule</label>
                            <select id="ruleSelect">
                                <option selected>Overall</option>
                                <option value="">加载中...</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label class="control-label">🔍 搜索阶段</label>
                            <input type="text" id="ruleSearch" placeholder="输入阶段名称..." class="search-input">
                        </div>
                    </div>
                </div>

                <!-- <div class="card">
                    <div class="card-header">
                        <div class="chart-type-buttons" id="chartTypeButtons">
                            <button class="btn btn-primary chart-type-btn" data-type="runtime">⏱️ Runtime</button>
                            <button class="btn btn-secondary chart-type-btn" data-type="memory">💾 Memory</button>
                        </div>
                    </div>
                </div> -->

                <div class="card">
                    <div class="card-header">
                        <div class="chart-type-buttons" id="chartTypeButtons">
                            <button class="btn btn-primary chart-type-btn" data-type="runtime">⏱️ Runtime</button>
                            <button class="btn btn-secondary chart-type-btn" data-type="memory">💾 Memory</button>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-secondary" id="openDatePickerBtn">📅 选择日期范围</button>
                            <button class="btn btn-secondary" id="selectRecentBtn">🕐 最近51条</button>
                            <button class="btn btn-secondary" id="selectAllDatesBtn">📆 显示全部</button>
                        </div>
                            <span class="tooltip" data-tip="MR更新日期会高亮显示">ℹ️</span>
                    </div>
                    <div class="card-header">
                        <div class="card-title" id="chartCardTitle">⏱️ Runtime 性能曲线</div>
                        <!-- <div class="btn-group">
                            <button class="btn btn-secondary" id="openDatePickerBtn">📅 选择日期范围</button>
                            <button class="btn btn-secondary" id="selectRecentBtn">🕐 最近51条</button>
                            <button class="btn btn-secondary" id="selectAllDatesBtn">📆 显示全部</button>
                            <span class="tooltip" data-tip="MR更新日期会高亮显示">ℹ️</span>
                        </div> -->
                    </div>
                    <div class="chart-wrapper">
                        <div id="chart-runtime" class="chart-container"></div>
                        <div id="chart-memory" class="chart-container hidden"></div>
                    </div>
                    <div class="stats-grid" id="stats-main"></div>
                </div>

                <div class="info-bar">
                    <span>📅 数据范围: <strong id="dateRange">-</strong></span>
                    <span>📈 数据点数: <strong id="dataPoints">0</strong></span>
                    <span>🔧 当前阶段: <strong id="currentRuleName">未选择</strong></span>
                    <span>🎨 ECharts 交互式图表</span>
                </div>
            </div>

            <!-- ==================================================
                视图2: 多线程对比 - 与时序曲线图一致的切换按钮
            ================================================== -->
            <div id="multithreadView" class="view-container">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">📊 项目概览</div>
                        <!-- <div class="btn-group">
                            <button class="btn btn-secondary" id="multiRefreshBtn">🔄 刷新数据</button>
                        </div> -->
                    </div>
                    <div class="stats-grid" id="multiStats"></div>
                </div>

                <div class="card">
                    <div class="control-bar">
                        <div class="control-group">
                            <label class="control-label">📁 QOR Case</label>
                            <select id="multiCaseSelect">
                                {% for project in project_list %}
                                <option value="{{ project.id }}">{{ project.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="control-group">
                            <label class="control-label">🔧 阶段/Rule</label>
                            <select id="multiRuleSelect">
                                <option value="">请先选择项目</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label class="control-label">📅 日期</label>
                            <select id="multiDateSelect">
                                <option value="">请先选择阶段</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 合并后的图表卡片（带切换按钮） -->
                <div class="multi-chart-card">
                    <div class="card-header">
                        <div class="card-title" id="multiChartCardTitle">⏱️ Runtime 性能曲线</div>
                    </div>
                    <div id="multi-runtime-container" style="height: 400px; width: 100%;">
                        <div id="chart-multi-runtime" style="height: 100%; width: 100%;"></div>
                    </div>
                    <div id="multi-memory-container" style="height: 400px; width: 100%; display: none;">
                        <div id="chart-multi-memory" style="height: 100%; width: 100%;"></div>
                    </div>
                </div>

                <div class="info-bar">
                    <span>📊 多线程性能对比分析</span>
                    <span>🎨 ECharts 交互式图表</span>
                </div>
            </div>

            <!-- ==================================================
                 视图3: 数据对比
            ================================================== -->
            <div id="compareView" class="view-container">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">📊 数据对比分析</div>
                        <div class="btn-group">
                            <button class="btn btn-secondary" id="exportCompareBtn">💾 导出CSV</button>
                        </div>
                    </div>
                    
                    <div class="control-bar">
                        <div class="control-group">
                            <label class="control-label">📁 QOR Case</label>
                            <select id="compareCaseSelect">
                                <option value="">-- 请选择case --</option>
                                {% for project in project_list %}
                                <option value="{{ project.id }}">{{ project.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="control-group">
                            <label class="control-label">🔧 对比模式</label>
                            <select id="compareModeSelect">
                                <option value="single">🎯 单阶段对比</option>
                                <option value="all">📊 全阶段对比</option>
                            </select>
                        </div>
                        <div class="control-group" id="compareRuleGroup">
                            <label class="control-label">🔧 选择阶段</label>
                            <select id="compareRuleSelect">
                                <option value="all">所有阶段</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="control-bar">
                        <div class="control-group">
                            <label class="control-label">📅 日期1 (基准)</label>
                            <select id="compareDate1">
                                <option value="">请先选择项目</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label class="control-label">📅 日期2 (对比)</label>
                            <select id="compareDate2">
                                <option value="">请先选择项目</option>
                            </select>
                        </div>
                        <div class="control-group">
                            <label class="control-label">⚙️ 误差模式</label>
                            <select id="toleranceMode">
                                <option value="absolute">绝对值</option>
                                <option value="percentage">百分比</option>
                            </select>
                            <div class="control-group">
                                <label class="control-label">📊 对比维度</label>
                                <select id="compareDimensionSelect">
                                    <option value="both">📈 全部 (Runtime + Memory)</option>
                                    <option value="runtime">⏱️ 仅 Runtime</option>
                                    <option value="memory">💾 仅 Memory</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    
                    <div class="control-bar">
                        <div class="control-group">
                            <label class="control-label">⏱️ Runtime容差</label>
                            <input type="number" id="toleranceRuntime" value="0" step="0.1">
                        </div>
                        <div class="control-group">
                            <label class="control-label">💾 Memory容差</label>
                            <input type="number" id="toleranceMemory" value="0" step="10">
                        </div>
                        <div class="control-group">
                            <button class="btn btn-primary" id="executeCompareBtn" style="margin-top: 1.5rem;">🔍 执行对比</button>
                        </div>
                    </div>
                </div>

                <!-- 对比结果区域 -->
                <div id="compareResultArea" class="card" style="display: none;">
                    <div class="card-header">
                        <div class="card-title" id="compareResultTitle">📈 对比结果</div>
                    </div>
                    <div id="compareSummary" class="stats-grid"></div>
                    <div class="table-container">
                        <table class="result-table" id="compareResultTable">
                            <thead id="compareTableHeader"></thead>
                            <tbody id="compareTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 日期选择模态框 -->
    <div id="datePickerModal" class="modal hidden">
        <div class="modal-content">
            <h3 style="margin-bottom: 1rem;">📅 选择要显示的日期</h3>
            <input type="text" id="dateFilterInput" placeholder="筛选日期..." style="width: 100%; margin-bottom: 1rem;">
            <div id="dateOptionsContainer" class="date-options"></div>
            <div class="btn-group" style="margin-top: 1rem;">
                <button class="btn btn-primary" id="confirmDateBtn">确认应用</button>
                <button class="btn btn-secondary" id="closeDateModalBtn">取消</button>
            </div>
        </div>
    </div>

    <!-- 加载遮罩 -->
    <div id="loadingOverlay" class="modal hidden" style="background: rgba(0,0,0,0.7);">
        <div class="loading-spinner" style="width: 50px; height: 50px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite;"></div>
    </div>

    <script>
        const projectsData = {{ projects_data_json | tojson }};
        const perf = {{ perf | tojson }};
        const toolId = '{{ tool_id }}';
        const toolName = '{{ tool_name }}';
        const initialMode = '{{ request.args.get("mode", "single") }}';
        
        let currentProjectId = null;
        let currentRule = null;
        let selectedDates = [];
        let availableDates = [];
        let selectedThreads = ['0'];
        let currentChartType = 'runtime';
        let charts = {};
        let cachedToolData = {};
        let mrUpdateDates = {};
        let currentDataVersion = '';
        let currentMultiRule = null;
        let currentMultiDate = null;
        
    </script>
    
    <script src="{{ url_for('static', filename='js/tool.js') }}"></script>
</body>
</html>
